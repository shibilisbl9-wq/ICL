<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ICL Season 2</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .purple { fill:var(--league-purple); }
  .green { fill:var(--imama-green); }
  .night { fill:var(--night); }
  .tint { fill:var(--league-purple-bright); }
  .gold { fill:var(--boundary-gold); }
  .streak { fill:var(--league-purple-bright); }
  .streak.g { fill:var(--imama-green-bright); }
  .blk { rx:var(--radius-md); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:88px; line-height:.95; font-weight:700; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      night 216×288 slab bleeding off top and right (the broadcast ground) · league-purple 144×168 · imama-green 144×88 · league-purple-bright 64×64 tint · boundary-gold 32×32 once (it only marks boundaries and milestones) — ≈45% of the box
  arrangement one tall night slab at the right with satellites stepping down-left, like the ball's flight path in the logo
  pattern     speed-line pills, from the logo's own cricket-ball trail: 6 space-2-tall pills at 45° running up-right into the slab
  scales      sides in space-2 multiples; gutters space-4; pill height space-2 (rx 4 = half); block corners radius-md
-->
<rect class="night" x="264" y="-12" width="228" height="312"/>
<rect class="purple blk" x="104" y="104" width="144" height="168" rx="12"/>
<rect class="green blk" x="0" y="184" width="88" height="88" rx="12"/>
<rect class="tint blk" x="184" y="24" width="64" height="64" rx="12"/>
<rect class="gold blk" x="408" y="224" width="32" height="32" rx="6"/>
<g transform="rotate(-45 360 144)">
  <rect class="streak" x="232" y="100" width="176" height="8" rx="4"/>
  <rect class="streak" x="272" y="124" width="200" height="8" rx="4"/>
  <rect class="streak g" x="256" y="148" width="160" height="8" rx="4"/>
  <rect class="streak" x="296" y="172" width="120" height="8" rx="4"/>
  <rect class="streak g" x="312" y="196" width="96" height="8" rx="4"/>
  <rect class="streak" x="336" y="220" width="56" height="8" rx="4"/>
</g>
</svg>
</div>
<div class="words">
  <h1 class="name">ICL<br>Season 2</h1>
  <p class="tag">Imama Cricket League, UAE. Green for the game, purple for the league.</p>
</div>
</div>
</body>
</html>
