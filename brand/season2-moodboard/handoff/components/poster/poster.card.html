<div id="root"></div>
<script type="text/babel">
window.ICL_READY.then(()=>{
const { Numeral, ScriptCaps, TornTape, Ribbon, PlayerCutout, CrosshairRule, RoleBadge, HandCircle, TeamTag, StatBlock, WalkoutCard, JerseyTile, PosterFrame, PosterHeader } = window.ICL;
const L = ({children}) => <div style={{fontFamily:"var(--font-mono)",fontSize:11,letterSpacing:".1em",color:"var(--text-muted)",marginTop:8}}>{children}</div>;
function App(){
 const g=[["white","grid","icl-logo-ink"],["floodlight","none","icl-logo-ink"],["night","halftone","icl-logo-white"],["quiet","none","icl-logo-green"],["gradient","grid","icl-logo-white"]];
 return(<div style={{display:"flex",gap:12}}>{g.map(([gr,t,l])=>(
  <div key={gr}><PosterFrame ground={gr} texture={t} displayWidth={122} style={{outline:"1px solid var(--border-hairline)"}}>
   <PosterHeader logoSrc={"../../assets/"+l+".png"} meta={["SEASON 02"]} logoWidth={200}/>
   <CrosshairRule items={["ICL","S02"]} style={{position:"absolute",left:72,right:72,bottom:64}} size={30}/>
  </PosterFrame><L>{gr.toUpperCase()}{t!=="none"?" · "+t.toUpperCase():""}</L></div>))}</div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
