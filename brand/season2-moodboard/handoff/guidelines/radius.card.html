<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="Near-square posters; round only on UI cards & pills" -->
<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--icl-white);color:var(--text-primary);font-family:var(--font-sans)}</style>
<div style="display:flex;gap:20px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:8px"><div style="width:90px;height:110px;border:1.5px solid var(--icl-ink);border-radius:var(--radius-poster);"></div><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em">--radius-poster</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:90px;height:110px;border:1.5px solid var(--icl-ink);border-radius:var(--radius-tile);"></div><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em">--radius-tile</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:140px;height:90px;border:1.5px solid var(--icl-ink);border-radius:var(--radius-card);"></div><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em">--radius-card</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:120px;height:44px;border:1.5px solid var(--icl-ink);border-radius:var(--radius-pill);"></div><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em">--radius-pill</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:90px;height:70px;border:4px solid var(--accent-highlight);border-radius:var(--radius-hand-circle);transform:rotate(-8deg)"></div><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em">--radius-hand-circle</span></div></div>
