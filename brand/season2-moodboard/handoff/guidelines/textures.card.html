<!-- @dsCard group="Brand" viewport="700x200" name="Textures" subtitle="Grid, halftone, contact shadow — no stock skies" -->
<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--icl-white);color:var(--text-primary);font-family:var(--font-sans)}</style>
<div style="display:flex;gap:12px">
<div style="flex:1"><div style="height:130px;border:1px solid var(--border-hairline);border-radius:var(--radius-tile);background:#fff;background-image:var(--texture-grid);background-size:18px 18px"></div><div style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;margin-top:6px">--TEXTURE-GRID</div></div>
<div style="flex:1"><div style="height:130px;border-radius:var(--radius-tile);background:var(--surface-night);position:relative;overflow:hidden"><div style="position:absolute;inset:0;background-image:var(--texture-halftone);background-size:9px 9px;mask-image:radial-gradient(ellipse 70% 60% at 60% 40%,#000,transparent 80%)"></div></div><div style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;margin-top:6px">--TEXTURE-HALFTONE</div></div>
<div style="flex:1"><div style="height:130px;border:1px solid var(--border-hairline);border-radius:var(--radius-tile);background:#fff;position:relative"><div style="position:absolute;left:30px;right:30px;top:86px;height:24px;background:var(--shadow-contact)"></div><div style="position:absolute;left:70px;top:18px;width:66px;height:82px;border:1.5px dashed var(--icl-ink);border-radius:33px 33px 6px 6px"></div></div><div style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;margin-top:6px">--SHADOW-CONTACT</div></div></div>
