<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--icl-white);color:var(--text-primary);font-family:var(--font-sans)}</style>
<div style="display:flex;height:56px;border-radius:4px;overflow:hidden;border:1px solid var(--border-hairline);font-family:var(--font-mono);font-size:12px;letter-spacing:.06em">
<div style="width:55%;background:var(--icl-floodlight);display:flex;align-items:center;padding-left:12px">FLOODLIGHT 55</div>
<div style="width:18%;background:var(--icl-ink);color:var(--text-on-dark);display:flex;align-items:center;padding-left:10px">INK 18</div>
<div style="width:15%;background:var(--icl-green);display:flex;align-items:center;padding-left:10px">GREEN 15</div>
<div style="width:8%;background:var(--icl-violet);color:#fff;display:flex;align-items:center;padding-left:6px">VIO 8</div>
<div style="width:4%;background:var(--icl-flare)"></div></div>
<div style="display:flex;gap:16px;align-items:center;margin-top:16px"><span style="width:44px;height:44px;border-radius:50%;background:var(--icl-flare)"></span><div><div style="font-family:var(--font-display);font-weight:800;font-size:22px">FLARE · #FF5B24</div><div style="font-size:13px;color:var(--text-secondary)">Circled dates, LIVE tags, the final. Never a fill behind text.</div></div></div>
