<!-- @dsCard group="Social posts" viewport="1280x820" name="ICL S2 poster studio" subtitle="Seven poster templates composed from the components" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../lib/ds-loader.js"></script>
<style>*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:var(--icl-floodlight);color:var(--text-primary);font-family:var(--font-sans)}button{font:inherit;cursor:pointer}</style>
<div id="root" style="height:100%"></div>
<script type="text/babel" src="posters.jsx"></script>
<script type="text/babel">
window.ICL_READY.then(()=>{
const P = window.POSTERS;
const LIST = [["announcement","Season announcement",P.Announcement],["countdown","Countdown",P.Countdown],["matchday","Match day",P.MatchDay],["potm","Player of the match",P.PlayerOfMatch],["walkout","Squad · walkout",P.Walkout],["fixtures","Fixtures",P.Fixtures],["thanks","Thank you",P.ThankYou]];
const Field = ({label, children}) => <label style={{display:"flex",flexDirection:"column",gap:6}}><span style={{fontFamily:"var(--font-mono)",fontSize:11,letterSpacing:".12em",color:"var(--text-muted)"}}>{label}</span>{children}</label>;
const inp = {font:"inherit",fontSize:15,padding:"9px 12px",border:"1px solid var(--border-hairline)",borderRadius:6,background:"#fff",color:"var(--text-primary)"};
function App(){
  const [cur,setCur] = React.useState(localStorage.getItem("icl-s2-poster")||"announcement");
  const [d,setD] = React.useState({script:"Second Innings",headline:"WE GO AGAIN",days:"3",a:"bt",b:"dd",first:"Firstname",last:"Lastname",stat:"64*",statDetail:"31 balls · 4×6",song:"Walkout song",artist:"Artist name"});
  React.useEffect(()=>localStorage.setItem("icl-s2-poster",cur),[cur]);
  const mainRef = React.useRef(null); const [pw,setPw] = React.useState(480);
  React.useEffect(()=>{ const el=mainRef.current; if(!el) return; const ro=new ResizeObserver(([e])=>{ const r=e.contentRect; setPw(Math.max(200,Math.floor(Math.min(r.width-64,(r.height-64)*0.8)))); }); ro.observe(el); return ()=>ro.disconnect(); },[]);
  const set = k => e => setD({...d,[k]:e.target.value});
  const item = LIST.find(l=>l[0]===cur)||LIST[0]; const Poster = item[2];
  const fields = {announcement:[["Script","script"],["Headline","headline"]],countdown:[["Days to go","days"]],matchday:[],potm:[["First name","first"],["Last name","last"],["Stat","stat"],["Stat detail","statDetail"]],walkout:[["First name","first"],["Last name","last"],["Song","song"],["Artist","artist"]],fixtures:[],thanks:[]}[cur];
  return (
    <div style={{display:"grid",gridTemplateColumns:"220px minmax(0,1fr) 260px",height:"100%"}}>
      <nav style={{borderRight:"1px solid var(--border-hairline)",padding:"28px 20px",overflow:"auto",display:"flex",flexDirection:"column",gap:4,background:"#fff"}}>
        <img src="../../assets/icl-logo-ink.png" alt="ICL" style={{width:120,marginBottom:12}}/>
        <div style={{fontFamily:"var(--font-mono)",fontSize:11,letterSpacing:".14em",color:"var(--text-muted)",marginBottom:14}}>SEASON 02 · POSTER STUDIO</div>
        {LIST.map(([id,label],i)=>(
          <button key={id} onClick={()=>setCur(id)} style={{display:"flex",gap:12,alignItems:"baseline",textAlign:"left",padding:"10px 12px",border:0,borderRadius:6,background:cur===id?"var(--icl-ink)":"transparent",color:cur===id?"var(--text-on-dark)":"var(--text-primary)"}}>
            <span style={{fontFamily:"var(--font-mono)",fontSize:11,opacity:.7}}>{String(i+1).padStart(2,"0")}</span>
            <span style={{fontFamily:"var(--font-display)",fontWeight:800,fontSize:22,textTransform:"uppercase"}}>{label}</span>
          </button>))}
      </nav>
      <main ref={mainRef} style={{display:"flex",minWidth:0,minHeight:0,overflow:"auto",backgroundImage:"var(--texture-grid)",backgroundSize:"24px 24px"}}>
        <div style={{margin:"auto",padding:32}}><div style={{boxShadow:"0 30px 60px -30px rgba(14,16,13,.35)"}}><Poster w={pw} d={d}/></div></div>
      </main>
      <aside style={{borderLeft:"1px solid var(--border-hairline)",padding:"28px 22px",overflow:"auto",display:"flex",flexDirection:"column",gap:18,background:"#fff"}}>
        <div style={{fontFamily:"var(--font-display)",fontWeight:900,fontSize:34,lineHeight:1,textTransform:"uppercase"}}>{item[1]}</div>
        <div style={{fontFamily:"var(--font-mono)",fontSize:11,letterSpacing:".12em",color:"var(--text-muted)"}}>1080 × 1350 · FEED</div>
        {cur==="matchday" ? <>
          <Field label="TEAM A"><select style={inp} value={d.a} onChange={set("a")}>{Object.entries(P.TEAMS).map(([k,v])=><option key={k} value={k}>{v[0]}</option>)}</select></Field>
          <Field label="TEAM B"><select style={inp} value={d.b} onChange={set("b")}>{Object.entries(P.TEAMS).map(([k,v])=><option key={k} value={k}>{v[0]}</option>)}</select></Field></> : null}
        {fields.map(([l,k])=><Field key={k} label={l.toUpperCase()}><input style={inp} value={d[k]} onChange={set(k)}/></Field>)}
        {!fields.length && cur!=="matchday" ? <div style={{fontSize:14,color:"var(--text-secondary)",lineHeight:1.5}}>Content for this template is edited in posters.jsx.</div> : null}
      </aside>
    </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
